plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hia'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

def githubUsername =
		System.getenv('GITHUB_ACTOR')
				?: findProperty('GitHubPackagesUsername')

def githubToken =
		System.getenv('GITHUB_TOKEN')
				?: findProperty('GitHubPackagesPassword')

repositories {
	mavenCentral()

	maven {
		name = 'GitHubPackages'
		url = uri('https://maven.pkg.github.com/hia-auction/hia-common')

		credentials {
			username = githubUsername
			password = githubToken
		}
	}
}

ext {
	set('springCloudVersion', "2025.0.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	runtimeOnly 'org.postgresql:postgresql'
	//todo: 추후 compose 별도의 작업으로 진행 현재는 runtimeOnly로 user전용DB사용

	implementation 'com.hia:hia-common:0.0.1-SNAPSHOT'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
