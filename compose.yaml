services:
  postgres:
    image: postgres:17
    container_name: hia-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: hia_user
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - hia-postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  keycloak-postgres:
    image: postgres:17
    container_name: hia-keycloak-postgres

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - hia-keycloak-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: hia-keycloak

    command: start-dev --import-realm

    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8180}:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      HIA_KC_HMAC_SECRET: ${HIA_KC_HMAC_SECRET}
      HIA_KC_AES_SECRET: ${HIA_KC_AES_SECRET}

    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

    depends_on:
      keycloak-postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  hia-postgres-data:
  hia-keycloak-postgres-data: